<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        <h1>What is your favorite color?</h1>
        <input type="radio" name="color" id="white" value="White">
        <label for="white">white</label>
        <br><br>
        <input type="radio" name="color" id="blue" value="Blue">
        <label for="blue">blue</label>
        <br><br>
        <input type="radio" name="color" id="pink" value="Pink">
        <label for="pink">pink</label>
        <br><br>
        <h1>What is your favorite sports?</h1>
        <input type="radio" name="sports" id="basketball" value="Basketball">
        <label for="basketball">Basketball</label>
        <br><br>
        <input type="radio" name="sports" id="soccer" value="Soccer">
        <label for="soccer">Soccer</label>
        <br><br>
        <input type="radio" name="sports" id="tennis" value="Tennis">
        <label for="tennis">Tennis</label>
        <br><br>
        <label for="name">Enter your name:</label> 
        <input type="text" name="name" id="name" placeholder="Something else:">
        <br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
